name: Collect exhibition candidates

on:
  workflow_dispatch:
    inputs:
      collector:
        description: Collector to run manually
        required: true
        default: venues
        type: choice
        options:
          - venues
          - x
          - all
  schedule:
    # X Recent Search: daily at 06:17 JST (21:17 UTC).
    - cron: '17 21 * * *'
    # Official venue sites: daily at 05:42 JST (20:42 UTC).
    - cron: '42 20 * * *'

permissions:
  contents: read

concurrency:
  group: exhibition-collector-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  collect-x:
    if: >-
      github.event.schedule == '17 21 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.collector == 'x' || inputs.collector == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      COLLECTOR_API_KEY: ${{ secrets.COLLECTOR_API_KEY }}
      COLLECTOR_ENDPOINT: https://exhibit.iruagaru.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r collector/requirements.txt
      - name: Collect recent X announcements
        run: >-
          python collector/x_recent_search.py
          --state-file /tmp/exhibit-x-state.json
          --bootstrap-hours 30

  collect-venues:
    if: >-
      github.event.schedule == '42 20 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.collector == 'venues' || inputs.collector == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COLLECTOR_API_KEY: ${{ secrets.COLLECTOR_API_KEY }}
      COLLECTOR_ENDPOINT: https://exhibit.iruagaru.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r collector/requirements.txt
      - name: Collect official venue schedules
        run: |
          python collector/website_collect.py
          python collector/photo_culture_collect.py
